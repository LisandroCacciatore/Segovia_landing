name: Deploy staging to GitHub Pages

on:
  # Manual a proposito: Pages es publico y este build contiene articulos que
  # todavia no aprobo Santiago. No publicar automaticamente en cada push.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # El nombre va entre comillas: los ":" sin citar rompen el YAML y el
      # workflow no arranca (la version anterior no era parseable).
      - name: "Build (staging: base path + noindex)"
        run: npm run build:staging
        env:
          # Vite graba este valor al compilar. Si la variable del repo no
          # existe queda vacia y el formulario usa el fallback de WhatsApp.
          VITE_FORM_ENDPOINT: ${{ vars.VITE_FORM_ENDPOINT }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # Vite genera la carpeta dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
